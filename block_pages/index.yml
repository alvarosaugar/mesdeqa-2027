      - name: 'Leandro Meléndez '
        id: leandro
        company: (AKA Señor Performo)
        role: Performance Moderno
        bio: >
          Leandro Melendez is an avid performance test manager and consultant,
          podcast host on performance, presenter at testing conferences and many
          others. Has over 20 years of experience on IT business ranging from
          Developer, DBA, Project Manager and others.


          The last 10 years he has been working on the QA area, especifically on
          the Performance and Load testing area using tools as WinRunner,
          LoadRunner, JMeter, HPDiagnostics, NeoLoad, AppDyn, Dynatrace and many
          others.

          Has served multiple S&P500 customers all over the USA, Mexico, Canada,
          Brazil and Australia.


          He writes a performance testing blog called SeñorPerformo
          (www.srperf.com) and cooperates with the PerfBytes team in producing
          more online material for performance and agile testers.


          He hosts the PerfBytes podcast spanish version.

  - type: faq
    title: FAQ
    theme: is-light width-box box-fill
    questions:
      - question: Objetivo que tiene Mes de QA
        answer: >-
          Dar visibilidad a QA y establecer relaciones entre ponentes y
          comunidades que tratan el tema.
      - question: De quién son las sesiones
        answer: >-
          Las sesiones son de las comunidades o la persona que la dé, por lo que
          son ellas las que deciden y gestionan (podemos ayudar si se necesita).
      - question: Requisitos para participar
        answer: >-
          Sólo se piden dos requitos:

          1. La temática de la sesión debe ser QA;

          2. Se anuncia la iniciativa y comparte la web al comienzo de la sesión
          para dar visiblidad al resto de participantes

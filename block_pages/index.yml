blocks:
  - type: hero
    title: Mes de QA 4
    intro: Cuarta edición
    text: >-
      La web se irá actualizando según auncie cada organizador sus sesiones.
      También pueden aparecer más sesiones durante el mes, por lo que no pierdas
      de vista la web.
  - type: text
    title: Mes de QA
    theme: is-light width-box box-border
    columns: false
    text: >

      Es una iniciativa donde se anima a que, durante un mismo mes, distintas
      comunidades puedan organizar y promocionar charlas y encuentros sobre esa
      temática, y dotar de un punto para la promoción cruzada de esas charlas y
      comunidades.


      ¿Más información? ¿Ediciones anteriores y más? Accede a la [web del Mes de
      QA](https://mesdeqa.github.io/).
  - type: calendar
    title: Calendar
    description: |2-
       Hay sesiones en varios países, por lo que se recomienda revisar la hora en tu huso horario. **Las sesiones tienen la hora del lugar en el que se hacen.** 

       Se pueden usar páginas para comprobar la hora como por ejemplo [ésta](https://www.zeitverschiebung.net/es/).
    id: calendar
    days:
      - title: 1/06/2025
        events:
          - title: Performance Moderno
            id: Performance_Moderno
            label: remoto
            description: >-
              Tenemos a Leandro AKA Señor Performo trayendo del equipo de
              WebPerf BCN, una descripcion de por que Performance testing no es
              lo mismo que Load testing y de como afrontar el performance
              moderno.


              **Aquí tenéis la sesión ([enlace a
              YouTube](https://youtu.be/COU7aE3Juuk?si=bS7NkMH1CqApag7V)).**
            speakers:
              - leandro
              - WebPerfBarcelona
      - title: 10/06/2025
        events:
          - time: '19:00 (UTC +2)'
            title: >-
              Top Security Flaws Hiding in Your Code Right Now – and How to Fix
              Them
            label: presencial
            subtitle: 'Esta sesión será en español '
            description: >-
              Security vulnerabilities aren’t just hypothetical—they’re real,
              from the MongoDB attack to the Log4Shell disaster, and they’re
              hiding in your code right now. In this session, we’ll explore the
              most common and dangerous flaws: SQL Injection, Deserialization
              Injection, and Logging Injection.


              We’ll explain how these vulnerabilities work, why they’re so
              risky, and how to fix them through examples.


              You'll leave with practical tips for safeguarding your
              applications, including best practices for SQL query
              parameterization, secure deserialization techniques, the
              importance of sanitizing logs, and how to use tooling to prevent
              these flaws more easily.


              Audience Takeaways:


              Deep understanding of SQL Injection, Deserialization Injection,
              and Logging Injection.

              Practical code examples and fixes to secure your applications.

              Insights into real-world case studies of major security breaches.

              Tooling that will help us to commit safe code.


              **[Meetup
              MadridJUG](https://www.meetup.com/es-ES/madridjug/events/308115167/?eventOrigin=home_page_upcoming_events%24all)**


              **[Meetup
              MadridGUG](https://www.meetup.com/es-ES/madrid-gug/events/308115158/?eventOrigin=home_page_upcoming_events%24all)**
            speakers:
              - jonathanVilla
      - title: 17/06/2025
        events:
          - time: '18:00 (UTC +2)'
            title: How a Breakup Story Reduced Our Test Pipeline Time
            label: presencial
            description: >
              Every great breakup story comes with drama, tough decisions… and
              sometimes, an unexpected breakthrough.


              Ours began when we realized our test suite was taking almost an
              hour to run—and we were still pretending everything was fine. It
              was clear: we had to make a decision.


              In this talk, I'll walk you through how breaking up with our old
              test runner improved our testing pipeline performance. We'll dive
              into the migration, the technical wins, and the lessons we learned
              along the way. If your test suite feels more like a bottleneck
              than a safety net, this story might inspire your next move.


              **[Meetup Ministry of Testing
              Barcelona](https://www.meetup.com/mot-barcelona/events/308225855/?utm_medium=referral&utm_campaign=share-btn_savedevents_share_modal&utm_source=link)**
            speakers:
              - luisThur
          - time: '19:00 (UTC +2)'
            title: Why Should Devs Automate?
            label: presencial
            description: >-
              This session explores how smart automation practices from a
              developer's perspective can drastically reduce bugs, cut costs,
              and accelerate delivery before issues reach QA or production
              environments.



              **[Meetup Ministry of Testing
              Barcelona](https://www.meetup.com/mot-barcelona/events/308225855/?utm_medium=referral&utm_campaign=share-btn_savedevents_share_modal&utm_source=link)**
            speakers:
              - mauroGioberti
      - title: 19/06/2025
        events:
          - time: '18:30  (UTC +2)'
            title: 'Smart Test Adviser: Tu copiloto de IA para decidir qué testear'
            label: presencial
            description: >-
              ¿Alguna vez te preguntaste si estás invirtiendo tiempo y recursos
              en los tests correctos? En esta charla te presentamos Smart Test
              Adviser, una herramienta desarrollada por el equipo de QA de
              Telefónica Innovación Digital que utiliza algoritmos propios de
              inteligencia artificial para ayudarte a priorizar qué pruebas
              ejecutar en función de los cambios introducidos en el código.


              Verás cómo esta solución analiza el contexto, el historial y el
              impacto potencial de cada modificación para recomendar los tests
              más relevantes, optimizando esfuerzos, reduciendo redundancias y
              mejorando la calidad del software. Hablaremos del problema que
              resuelve, su arquitectura general, casos de uso reales y los
              aprendizajes del proceso de desarrollo.


              Una charla pensada para quienes quieren llevar el testing al
              siguiente nivel con ayuda de la IA.


              **[Meetup Ministry of Testing -
              Valencia](https://www.meetup.com/mot-valencia/events/307604746/?eventOrigin=group_upcoming_events)**
            speakers:
              - jpb
      - title: 26/06/2025
        events:
          - title: QA & Friends - Tendencias de QA en 2025
            label: remoto
            description: >-
              En esta sesión el equipo de la comunidad de QAMakers hablará sobre
              las últimas tendencias de QA a lo largo de 2025 y como nos ha
              cambiado la vida temas como la IA


              **[Enlace para
              registrarse](https://www.qamakers.com/p/qa-friends-capitulo-6-hablando-de-qa.html)**
            speakers:
              - QAMakersTeam

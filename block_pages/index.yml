        role: ' Top Security Flaws Hiding in Your Code Right Now – and How to Fix Them'
        bio: >
          Java Champion, Organiser at BarcelonaJUG and cofounder of JBCNConf and
          DevBcn conferences in Barcelona.


          Currently working as a Developer Advocate in Java at Sonar
          (SonarLint,SonarQube), focused on Clean Code & Security.


          I have worked as a (paid) developer since the first release of The
          Secret of Monkey Island, about 30 years ago using Go on Kubernetes for
          a Service Mesh layer on top of Istio | Java on Kubernetes for K8s
          Operator, Rest API, using Quarkus, GraalVM, Apache Camel | PHP | VB |
          Python | Pascal | C


          I am very interested in simulated reality, psychology, philosophy, and
          Java.

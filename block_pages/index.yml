      - name: Ministry of Testing - Valencia
        id: MoTV
        role: Comunidad
        bio: >
          Ministry of Testing Valencia es nuestro local chapter en Valencia.


          Somos un grupo de entusiastas probadores de software, de los que
          dicen: «¡Hay que probar antes de una release!» y «¡Redeu!», cuando
          algo no funciona como se esperaba.


          Nuestros encuentros tienen como objetivo reunir a personas para hablar
          y aprender sobre una buena y auténtica práctica de pruebas.
        image: /files/MoTV.webp
        links:
          - icon: browser
            url: 'https://www.ministryoftesting.com'
      - name: QAMakers
        id: QAMakers
        role: Comunidad
        bio: >
          QA con voz propia. Comunidad real, tips útiles y un Bootcamp que forma
          testers con actitud.


          QAMakers no nació para encajar. Nació para romper el molde del QA
          tradicional.

          Creemos en la Cultura Maker: crear sin permiso, aprender sin miedo,
          compartir sin filtros y participar sin jerarquías.

          Aquí no venimos a seguir procesos, venimos a reinventarlos.


          Formamos testers que piensan, desafían y hacen que las cosas funcionen
          de verdad.

          Si buscas teoría, hay mil sitios.

          Si buscas acción, aquí tienes el Bootcamp:

          www.qamakers.academy


          Esto no es solo QA. Es una forma de estar en el mundo. Bienvenid@.
        image: /files/qamakers.png
        links:
          - icon: browser
            url: 'https://www.qamakers.com'
          - icon: browser
            url: 'https://www.qamakers.academy'
      - name: WebPerf Barcelona
        id: WebPerfBarcelona
        role: Comunidad
        bio: >+
          Help build a faster Internet! 


          Meet with fellow developers, sysadmins, and anyone interested in Web
          Performance Optimization, to share ideas, make connections, and of
          course, have a drink and tapas.


          On topics ranging from server performance, code optimization,
          profiling, monitoring, Front-End/UX design, tips&tricks, and improving
          conversion rates.

        image: /files/webPerfBarcelona.avif
        links:
          - icon: calendar-check
            url: 'https://www.meetup.com/barcelona-web-performance/'

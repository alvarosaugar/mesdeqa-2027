    speakers:
      - name: Jordi Puig Bou
        id: jpb
        role: 'Smart Test Adviser: Tu copiloto de IA para decidir qué testear'
        bio: >-
          Ingeniero de Telecomunicaciones y QA por accidente, con más de 10 años
          mejorando la calidad del software en entornos complejos. Actualmente
          en Telefónica, validando plataformas críticas y afinando procesos de
          entrega continua. Me apasiona la automatización, el diseño de pruebas
          con enfoque humano y compartir aprendizajes sobre cómo hacer testing
          que realmente aporte valor. Interesado en la arquitectura de test y en
          evolucionar frameworks de automatización que nos hagan la vida más
          fácil… y nos dejen tiempo para innovar en metodologías para hacer un
          testing más eficiente.
        image: /files/jordipb.jpeg
        links:
